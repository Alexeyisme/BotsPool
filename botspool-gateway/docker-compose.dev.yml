# Docker Compose for BotsPool Gateway Development
# Development environment with hot reload

version: '3.8'

services:
  # PostgreSQL Database (Development)
  postgres-dev:
    image: postgres:16-alpine
    container_name: botspool-postgres-dev
    environment:
      POSTGRES_DB: botspool_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - botspool-dev-network

  # Redis Cache (Development)
  redis-dev:
    image: redis:7-alpine
    container_name: botspool-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - botspool-dev-network

  # BotsPool Gateway (Development)
  gateway-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: botspool-gateway-dev
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres-dev:5432/botspool_dev
      - REDIS_URL=redis://redis-dev:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
    networks:
      - botspool-dev-network
    depends_on:
      - postgres-dev
      - redis-dev
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # Database Admin (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: botspool-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@botspool.ai
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - botspool-dev-network
    depends_on:
      - postgres-dev

  # Redis Admin (Optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: botspool-redis-commander
    environment:
      REDIS_HOSTS: local:redis-dev:6379
    ports:
      - "8081:8081"
    networks:
      - botspool-dev-network
    depends_on:
      - redis-dev

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  botspool-dev-network:
    driver: bridge
